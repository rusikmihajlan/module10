services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: module10-jenkins:lts
    container_name: module10-jenkins
    restart: unless-stopped
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      JAVA_OPTS: '-Djenkins.install.runSetupWizard=true'
      NODE_USE_ENV_PROXY: '1'
volumes:
  jenkins_home:
